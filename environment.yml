name: stellar-stream-dm
channels:
  - conda-forge
  - defaults
# PyTorch is installed via pip (see pip section) — NOT from the pytorch channel.
# The pytorch channel's Windows CUDA conda packages ship a CPU-only binary
# despite CUDA build strings. The pip wheels from download.pytorch.org/whl/cu124
# are the officially supported CUDA path on Windows.
channel_priority: strict

dependencies:
  - python=3.11
  - numpy>=1.26  # numpy 2.x works fine; galpy/scipy/astropy all support it
  - scipy>=1.12
  - astropy>=6.1
  - astroquery>=0.4.7
  - galpy>=1.9
  - h5py>=3.11
  - pandas>=2.2
  - scikit-learn>=1.5
  - matplotlib>=3.9
  - seaborn>=0.13
  - corner>=2.2
  - tqdm>=4.66
  - joblib>=1.4
  - pyyaml>=6.0
  - dacite>=1.8
  - jupyterlab>=4.2
  - ipywidgets>=8.1
  # healpy: pip build fails on Windows MSVC; pre-built on conda-forge
  - healpy>=1.16
  - pip
  - pip:
    # ---- PyTorch 2.5.1 + CUDA 12.4 ----------------------------------------
    # Must use the official pytorch.org index — conda channel ships CPU binary
    - --extra-index-url https://download.pytorch.org/whl/cu124
    - "torch==2.5.1+cu124"
    - "torchvision==0.20.1+cu124"
    - "torchaudio==2.5.1+cu124"
    # ---- PyTorch Geometric (CUDA 12.4 build) --------------------------------
    - --find-links=https://data.pyg.org/whl/torch-2.5.1+cu124.html
    - torch-geometric
    - torch-scatter
    - torch-sparse
    - torch-cluster
    # ---- JAX (CPU-only on Windows — no official Windows CUDA support) ----------
    # Install from Google's JAX releases index which ships jax+jaxlib together.
    # JAX is used by numpyro (HMC sampler); all GPU work is in PyTorch.
    - "jax[cuda12_pip]"
    # (If the cuda12_pip extra fails, fall back to: pip install jax[cpu])
    # JAX releases index: -f https://storage.googleapis.com/jax-releases/jax_cuda_releases.html
    # ---- galstreams: installed manually after env create (see README) ---------
    # galstreams lists gala as a dependency; gala has no Windows binary wheels
    # and its C extensions fail to compile with MSVC.  Install post-create via:
    #   pip install git+https://github.com/cmateu/galstreams.git@main --no-deps
    # A minimal gala stub (gala/__init__.py + coordinates + dynamics) is created
    # post-install in site-packages to allow galstreams to import on Windows.
    # All galstreams runtime needs (astropy, numpy, scipy) are already in env.
    # ---- Inference / SBI stack ----------------------------------------------
    - "sbi>=0.23.0,<0.25"
    - "numpyro>=0.21"  # numpyro 0.21+ required for jax 0.10 (dropped host_callback)
    - "lampe>=0.9"
    - "dustmaps>=1.0.12"
    # ---- Experiment tracking ------------------------------------------------
    - "wandb>=0.17"
    # ---- Utilities ----------------------------------------------------------
    - "tqdm-joblib>=0.0.4"
    - "memory-profiler>=0.61"
    # ---- Dev tools ----------------------------------------------------------
    - "black>=24"
    - "ruff>=0.4"
    - "pytest>=8"
    - "pytest-cov>=5"
